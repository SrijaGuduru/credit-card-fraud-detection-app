<!DOCTYPE html>
<html>
<head>
    <title>AI Fraud Detection System</title>
</head>
<body>

<h2>AI Credit Card Fraud Detection</h2>

<select id="model">
    <option value="lstm">LSTM</option>
    <option value="autoencoder">Autoencoder</option>
    <option value="liquid">Liquid Neural Network</option>
</select>

<br><br>

<input type="text" id="features" placeholder="Enter 30 comma-separated values">

<br><br>

<button onclick="predict()">Predict</button>

<h3 id="result"></h3>

<script>
function predict() {
    let values = document.getElementById("features").value.split(",").map(Number);
    let modelType = document.getElementById("model").value;

    fetch("/predict", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            features: values,
            model: modelType
        })
    })
    .then(res => res.json())
    .then(data => {
        document.getElementById("result").innerHTML =
            "Model: " + data.model_used +
            "<br>Prediction: " + data.prediction +
            "<br>Risk Score: " + data.risk_score.toFixed(5);
    });
}
</script>

</body>
</html>
